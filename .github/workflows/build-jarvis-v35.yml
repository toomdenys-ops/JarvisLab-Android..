name: JARVIS V3.5 Gemma3 CPU + Qwen + DeepSeek

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Compilar APK V3.5
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Extrair fonte V3.5
        shell: bash
        run: |
          test -f JarvisLab_Autonomo_V3_5_Gemma3_CPU.zip || { echo 'Envie JarvisLab_Autonomo_V3_5_Gemma3_CPU.zip para a raiz do repositorio'; exit 1; }
          unzip -oq JarvisLab_Autonomo_V3_5_Gemma3_CPU.zip -d .
          test -f app/src/main/java/br/com/jarvislab/autonomo/Gemma3WorkerService.kt
          test -f app/src/main/java/br/com/jarvislab/autonomo/QwenWorkerService.kt
          grep -q 'version "2.2.20"' build.gradle.kts
          grep -q 'litertlm-android:0.16.1' app/build.gradle.kts

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Instalar NDK e ferramentas
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build glslang-tools glslc python3

      - name: Preparar llama.kt para Qwen e Gemma 4 com ARMv8 basico
        shell: bash
        run: |
          mkdir -p libs
          git clone --depth 1 https://github.com/tensai-app/llama.kt.git libs/llama.kt
          git -C libs/llama.kt submodule update --init --recursive
          bash libs/llama.kt/scripts/bootstrap.sh
          bash libs/llama.kt/scripts/build-opencl.sh
          python3 - <<'PYCODE'
          from pathlib import Path
          cmake = Path('libs/llama.kt/llama-kt/src/main/cpp/CMakeLists.txt')
          source = cmake.read_text()
          old = '-march=armv8.2-a+dotprod'
          assert source.count(old) == 1, f'Esperado um {old}, encontrado {source.count(old)}'
          cmake.write_text(source.replace(old, '-march=armv8-a'))
          gradle = Path('libs/llama.kt/llama-kt/build.gradle.kts')
          source = gradle.read_text()
          old = 'plugins { id("com.android.library") }'
          new = '''plugins {
              id("com.android.library")
              id("org.jetbrains.kotlin.android")
          }'''
          if old in source:
              gradle.write_text(source.replace(old, new, 1))
          elif 'id("org.jetbrains.kotlin.android")' not in source:
              raise SystemExit('O plugin llama-kt mudou; e necessario conferir o modulo.')
          print('Configuracao de CPU ARMv8 basico e Kotlin concluida')
          PYCODE

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compilar Jarvis V3.5
        shell: bash
        run: gradle --no-daemon --max-workers=2 :app:assembleDebug
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: '2'

      - name: Disponibilizar APK V3.5
        uses: actions/upload-artifact@v4
        with:
          name: JarvisLab-V3.5-Gemma3-CPU-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
