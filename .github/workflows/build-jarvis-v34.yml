name: JARVIS V3.4 3 Inteligencias

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Extrair V3.4 sem alterar APK anterior
        shell: bash
        run: |
          test -f JarvisLab_Autonomo_V3_4_Triple_IA.zip || { echo 'Envie o ZIP V3.4 para a raiz do repositorio'; exit 1; }
          unzip -oq JarvisLab_Autonomo_V3_4_Triple_IA.zip -d .
          test -f app/src/main/java/br/com/jarvislab/autonomo/QwenWorkerService.kt

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Instalar NDK e ferramentas
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build glslang-tools glslc python3

      - name: Preparar motor local e aplicar ARMv8 basica
        shell: bash
        run: |
          mkdir -p libs
          git clone --depth 1 https://github.com/tensai-app/llama.kt.git libs/llama.kt
          git -C libs/llama.kt submodule update --init --recursive
          bash libs/llama.kt/scripts/bootstrap.sh
          bash libs/llama.kt/scripts/build-opencl.sh
          python3 - <<'PYCODE'
          from pathlib import Path
          p = Path('libs/llama.kt/llama-kt/src/main/cpp/CMakeLists.txt')
          source = p.read_text()
          old = '-march=armv8.2-a+dotprod'
          assert source.count(old) == 1, f'Esperado exatamente um {old}, encontrado {source.count(old)}'
          p.write_text(source.replace(old, '-march=armv8-a'))
          assert '-march=armv8.2-a+dotprod' not in p.read_text()
          print('CPU baseline armv8-a confirmada')
          PYCODE
          grep -n -- '-march=armv8-a' libs/llama.kt/llama-kt/src/main/cpp/CMakeLists.txt

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compilar APK V3.4 independente
        shell: bash
        run: gradle --no-daemon --max-workers=2 :app:assembleDebug
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: '2'

      - name: Publicar APK novo sem substituir outros
        uses: actions/upload-artifact@v4
        with:
          name: JarvisLab-V3.4-3-IAs-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
