name: Jarvis Autonomo Qwen ADB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Extrair novo projeto (preserva o APK anterior)
        shell: bash
        run: |
          test -f JarvisLab_Autonomo_Qwen_ADB.zip || { echo 'Envie JarvisLab_Autonomo_Qwen_ADB.zip para a raiz do repositorio'; exit 1; }
          unzip -oq JarvisLab_Autonomo_Qwen_ADB.zip -d .
          test -f app/src/main/java/br/com/jarvislab/autonomo/MainActivity.kt

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Instalar NDK e ferramentas
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build glslang-tools python3

      - name: Preparar motor Qwen GGUF local
        shell: bash
        run: |
          mkdir -p libs
          git clone --depth 1 https://github.com/tensai-app/llama.kt.git libs/llama.kt
          git -C libs/llama.kt submodule update --init --recursive
          bash libs/llama.kt/scripts/bootstrap.sh
          bash libs/llama.kt/scripts/build-opencl.sh

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compilar APK autonomo arm64
        shell: bash
        run: gradle --no-daemon --max-workers=2 :app:assembleDebug
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: '2'

      - name: Publicar novo APK
        uses: actions/upload-artifact@v4
        with:
          name: JarvisLab-Autonomo-Qwen-ADB-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
